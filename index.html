---
layout: default
---

<section class="home">
  <h1 class="home-title">Latest Posts</h1>
  <div class="posts-list">
    {% for post in site.posts %}
    <article class="post-preview">
      <header>
        <h2 class="post-preview-title"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
        <p class="post-preview-meta">{{ post.date | date: "%B %-d, %Y" }}</p>
      </header>
      <p class="post-preview-excerpt">{{ post.excerpt | strip_html | truncatewords: 40 }}</p>
      <a class="post-preview-readmore" href="{{ post.url | relative_url }}">Read more →</a>
    </article>
    {% endfor %}
  </div>
</section>
