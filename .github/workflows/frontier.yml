name: Frontier Labs Generation

on:
  schedule:
    # Runs at 08:00 UTC every Monday
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Frontier Labs Task
        env:
          OPENAI_API_KEY_NEWSLETTERS: ${{ secrets.OPENAI_API_KEY_NEWSLETTERS }}
        run: python main.py --task frontier_labs

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "New Frontier Labs content generated"
          file_pattern: "_roll/*.md"
