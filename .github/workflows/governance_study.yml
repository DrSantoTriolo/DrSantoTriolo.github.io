name: Governance Study Generation

on:
  schedule:
    # Runs at 02:10 UTC every Sunday (every other week logic handled in job)
    # NOTE: When adding new scheduled workflows, stagger start times with 10 minute gaps
    # to avoid resource contention and API rate limits (e.g., 02:00, 02:10, 02:20, etc.)
    - cron: '10 2 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check if this is an even week (every other week)
        id: week_check
        run: |
          WEEK_NUM=$(date +%V)
          if [ $(( WEEK_NUM % 2 )) -eq 0 ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi
          echo "Current week number: $WEEK_NUM"

      - name: Skip if not scheduled week
        if: ${{ github.event_name == 'schedule' && steps.week_check.outputs.should_run != 'true' }}
        run: |
          echo "Skipping - this is not an even week"
          exit 0

      - name: Checkout code
        if: ${{ github.event_name == 'workflow_dispatch' || steps.week_check.outputs.should_run == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ github.event_name == 'workflow_dispatch' || steps.week_check.outputs.should_run == 'true' }}
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || steps.week_check.outputs.should_run == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        if: ${{ github.event_name == 'workflow_dispatch' || steps.week_check.outputs.should_run == 'true' }}
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Governance Study Task
        if: ${{ github.event_name == 'workflow_dispatch' || steps.week_check.outputs.should_run == 'true' }}
        env:
          OPENAI_API_KEY_NEWSLETTERS: ${{ secrets.OPENAI_API_KEY_NEWSLETTERS }}
        run: python main.py --task governance_study

      - name: Commit and Push changes
        if: ${{ github.event_name == 'workflow_dispatch' || steps.week_check.outputs.should_run == 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "New Governance Study content generated"
          file_pattern: "_roll/*.md"
