name: Behaviour Study Generation

on:
  schedule:
    # Runs at 08:00 UTC on the 1st of every month
    - cron: '0 8 1 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Behaviour Study Task
        env:
          OPENAI_API_KEY_NEWSLETTERS: ${{ secrets.OPENAI_API_KEY_NEWSLETTERS }}
        run: python main.py --task behaviour_analysis

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "New Behaviour Study content generated"
          file_pattern: "_roll/*.md"
