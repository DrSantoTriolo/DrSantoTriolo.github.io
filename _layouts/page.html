---
layout: default
---

<div class="page-hero">
  <div class="container">
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.description %}
      <p class="page-description">{{ page.description }}</p>
    {% endif %}
  </div>
</div>

<div class="page-content">
  <div class="container">
    <article class="page">
      <div class="entry">
        {{ content }}
      </div>
    </article>
  </div>
</div>
